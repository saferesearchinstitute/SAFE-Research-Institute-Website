<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Evidence Library | SAFE Research Institute</title>
  <script>
    // Old links looked like policy.html?id=<document>. Each document now has its own page.
    var id = new URLSearchParams(location.search).get('id');

  </script>
</head>
<body>
  <p>This document has moved to the <a href="library.html">Evidence Library</a>.</p>
</body>
